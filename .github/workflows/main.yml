name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir el zip
        run: |
          if [ -f MandoTele-GitHub.zip ]; then unzip -o MandoTele-GitHub.zip; fi
          ls -R . | head -50
      - name: Buscar el proyecto
        run: |
          SPEC=$(find . -name project.yml -not -path "./build/*" | head -1)
          echo "Encontrado: $SPEC"
          echo "DIR=$(dirname "$SPEC")" >> $GITHUB_ENV
      - name: Escribir project.yml correcto
        working-directory: ${{ env.DIR }}
        run: |
          rm -f Sources/Info.plist
          cat > project.yml <<'YML'
          name: MandoTele
          options:
            bundleIdPrefix: com.alex
            deploymentTarget:
              iOS: "16.0"
          packages:
            WebOSClient:
              url: https://github.com/jareksedy/WebOSClient.git
              from: 1.5.1
          targets:
            MandoTele:
              type: application
              platform: iOS
              sources: [Sources]
              dependencies:
                - package: WebOSClient
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.alex.MandoTele
                  SWIFT_VERSION: "5.9"
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: Mando
                  UILaunchScreen: {}
                  UIUserInterfaceStyle: Dark
                  UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
                  UIApplicationSceneManifest:
                    UIApplicationSupportsMultipleScenes: false
                  NSLocalNetworkUsageDescription: "Mando necesita la red local para encontrar y controlar tu tele LG."
                  NSAppTransportSecurity:
                    NSAllowsLocalNetworking: true
                    NSAllowsArbitraryLoads: true
          YML
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar proyecto
        working-directory: ${{ env.DIR }}
        run: xcodegen generate
      - name: Compilar (archive)
        working-directory: ${{ env.DIR }}
        run: |
          set -o pipefail
          xcodebuild archive -project MandoTele.xcodeproj -scheme MandoTele \
            -configuration Release -sdk iphoneos \
            -archivePath build/MandoTele.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tail -n 80
      - name: Crear .ipa limpio
        working-directory: ${{ env.DIR }}
        run: |
          brew install ldid
          APP=build/MandoTele.xcarchive/Products/Applications/MandoTele.app
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision"
          codesign --remove-signature "$APP" || true
          ldid -S "$APP/MandoTele"
          echo "--- Info.plist ---"
          plutil -p "$APP/Info.plist"
          echo "--- Binario ---"
          file "$APP/MandoTele"
          otool -L "$APP/MandoTele" | head -20
          rm -rf Payload MandoTele.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          xattr -cr Payload
          find Payload -name ".DS_Store" -delete
          zip -qry -X MandoTele.ipa Payload
          unzip -l MandoTele.ipa | head -30
          unzip -l MandoTele.ipa | grep -q "Payload/MandoTele.app/Info.plist" && echo "IPA correcto: tiene Payload/MandoTele.app"
      - name: Compilar versión para simulador (Appetize)
        working-directory: ${{ env.DIR }}
        run: |
          set -o pipefail
          xcodebuild build -project MandoTele.xcodeproj -scheme MandoTele \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tail -n 40
          cd build-sim/Build/Products/Debug-iphonesimulator
          vtool -show-build MandoTele.app/MandoTele | grep -i platform
          vtool -show-build MandoTele.app/MandoTele | grep -qi "IOSSIMULATOR" && echo "OK: es build de simulador"
          zip -qry -X "$GITHUB_WORKSPACE/${DIR#./}/MandoTele-simulador.zip" MandoTele.app
      - uses: actions/upload-artifact@v4
        with:
          name: MandoTele-ipa
          path: ${{ env.DIR }}/MandoTele.ipa
      - name: Publicar el .ipa en Releases
        working-directory: ${{ env.DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ipa-${{ github.run_number }}" MandoTele.ipa MandoTele-simulador.zip \
            --title "MandoTele ${{ github.run_number }}" \
            --notes "IPA sin firmar listo para firmar" \
            --target "${{ github.sha }}"
