name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar proyecto
        run: xcodegen generate
      - name: Compilar
        run: |
          xcodebuild -project MandoTele.xcodeproj -scheme MandoTele \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Crear .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MandoTele.app Payload/
          zip -r MandoTele.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MandoTele-ipa
          path: MandoTele.ipa
